<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mevis - A Secretária Sarcástica</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Markdown e Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'default' });
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Loading Dots Animation */
        .dot-typing {
            position: relative;
            left: -9999px;
            width: 8px;
            height: 8px;
            border-radius: 5px;
            background-color: #6366f1;
            color: #6366f1;
            box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1;
            animation: dot-typing 1.5s infinite linear;
        }

        @keyframes dot-typing {
            0% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            16.667% { box-shadow: 9984px -8px 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            33.333% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            50% { box-shadow: 9984px 0 0 0 #6366f1, 9999px -8px 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            66.667% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            83.333% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px -8px 0 0 #6366f1; }
            100% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
        }

        .chat-bubble { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilos para o Markdown dentro do chat */
        .chat-bubble p { margin-bottom: 0.75rem; }
        .chat-bubble p:last-child { margin-bottom: 0; }
        .chat-bubble ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .chat-bubble ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .chat-bubble pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; font-size: 0.875rem; }
        .chat-bubble code { font-family: monospace; background: #e2e8f0; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.875em; color: #b91c1c; }
        .chat-bubble pre code { background: transparent; color: inherit; padding: 0; }
        .chat-bubble table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.875rem; }
        .chat-bubble th, .chat-bubble td { border: 1px solid #cbd5e1; padding: 0.5rem; text-align: left; }
        .chat-bubble th { background-color: #f1f5f9; font-weight: 600; }
        .chat-bubble blockquote { border-left: 4px solid #cbd5e1; padding-left: 1rem; color: #64748b; font-style: italic; margin: 1rem 0; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col md:flex-row text-gray-800">

    <!-- Sidebar / Left Panel -->
    <aside class="w-full md:w-1/4 lg:w-1/5 bg-white border-r border-gray-200 flex flex-col justify-between shadow-sm z-10">
        <div class="p-6 flex flex-col items-center border-b border-gray-100">
            <div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-500 mb-4 shadow-inner">
                <i class="fa-solid fa-face-rolling-eyes text-4xl"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800">Mevis</h2>
            <p class="text-sm text-gray-500">Julgando suas decisões</p>
        </div>

        <div class="p-4 flex-1 overflow-y-auto">
            <div class="mb-6 text-center">
                <div id="clock-time" class="text-3xl font-bold text-indigo-600 mb-1">00:00</div>
                <div id="clock-date" class="text-sm text-gray-500 font-medium">Carregando data...</div>
            </div>

            <div class="space-y-2 mb-6">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-1">Ações Rápidas</h3>
                <button onclick="summarizeTasks()" class="w-full flex items-center justify-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-2 px-4 rounded-lg transition-colors text-sm font-medium border border-indigo-100">
                    <i class="fa-solid fa-bolt"></i> Resumir o desastre
                </button>
                <button onclick="generateSEI()" class="w-full flex items-center justify-center gap-2 bg-slate-50 hover:bg-slate-100 text-slate-700 py-2 px-4 rounded-lg transition-colors text-sm font-medium border border-slate-200">
                    <i class="fa-solid fa-file-signature"></i> Estruturar Minuta SEI
                </button>
                <button onclick="generateOSINT()" class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white py-2 px-4 rounded-lg transition-colors text-sm font-medium border border-slate-700">
                    <i class="fa-solid fa-magnifying-glass-chart"></i> Prompt OSINT
                </button>
            </div>
            
            <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg border border-gray-100">
                <span class="text-sm font-medium text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-volume-high text-indigo-500"></i> Tom de deboche
                </span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="voice-toggle" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                </label>
            </div>
        </div>
        
        <div class="p-4 bg-gray-50 text-xs text-center text-gray-400 border-t border-gray-200 flex flex-col gap-2">
            <span>Powered by Sarcasmo & Gemini</span>
            <div class="flex justify-center gap-4">
                <button onclick="clearChat()" class="text-red-500 hover:text-red-700 underline">Apagar Memória</button>
                <button onclick="resetApiKey()" class="text-blue-500 hover:text-blue-700 underline">Trocar Chave API</button>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col bg-white h-full relative">
        <header class="h-16 border-b border-gray-200 flex items-center px-6 justify-between bg-white/80 backdrop-blur-sm z-10">
            <h1 class="text-lg font-semibold text-gray-800 flex items-center gap-2">
                <i class="fa-regular fa-comments text-indigo-500"></i>
                Conversa (Infelizmente)
            </h1>
            <div class="flex items-center gap-3">
                <button id="live-audio-btn" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-colors shadow-sm">
                    <i class="fa-solid fa-microphone"></i>
                    <span id="live-audio-text">Falar com a Mevis</span>
                </button>
                <div id="status-indicator" class="flex items-center gap-2 text-sm text-green-600 font-medium bg-green-50 px-3 py-1 rounded-full">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                    </span>
                    Obrigada a estar online
                </div>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth bg-gray-50/50">
            <!-- Messages will be injected here -->
        </div>

        <div id="typing-indicator" class="hidden px-16 py-4 bg-gray-50/50">
            <div class="bg-gray-200 w-16 h-8 rounded-full flex items-center justify-center">
                <div class="dot-typing ml-3"></div>
            </div>
        </div>

        <div class="p-4 border-t border-gray-200 bg-white">
            <form id="chat-form" class="flex gap-2">
                <!-- Input Oculto para JSON/Arquivos -->
                <input type="file" id="file-upload" accept=".json,.txt,.csv,.md" class="hidden">
                
                <button type="button" onclick="document.getElementById('file-upload').click()" class="bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-xl px-4 py-3 transition-colors flex items-center justify-center shadow-sm" title="Anexar dump de dados (JSON/TXT)">
                    <i class="fa-solid fa-paperclip"></i>
                </button>

                <input type="text" id="chat-input" placeholder="Peça algo (tente não ser muito estúpido) ou anexe um dump..." 
                    class="flex-1 bg-gray-100 border-transparent focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 rounded-xl px-4 py-3 outline-none transition-all duration-200 text-gray-700">
                
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-6 py-3 transition-colors flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Right Panel / Task Manager -->
    <aside class="w-full md:w-1/4 lg:w-72 bg-white border-l border-gray-200 flex flex-col h-full shadow-sm z-10">
        <div class="p-5 border-b border-gray-200 bg-gray-50">
            <h3 class="font-semibold text-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-list-check text-indigo-500"></i>
                Tragédias Pendentes
            </h3>
        </div>
        
        <div class="p-4 border-b border-gray-100">
            <form id="task-form" class="flex gap-2">
                <input type="text" id="task-input" placeholder="Nova tarefa ignorada..." 
                    class="flex-1 bg-gray-50 border border-gray-200 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-lg px-3 py-2 text-sm outline-none transition-all">
                <button type="submit" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg px-3 py-2 transition-colors">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>
        </div>

        <div class="flex-1 overflow-y-auto p-2" id="tasks-container">
            <p id="empty-tasks-msg" class="text-sm text-gray-400 text-center mt-6 hidden">Milagre, não tem nada aqui. Ainda.</p>
        </div>
    </aside>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script type="module">
        // ==========================================
        // GERENCIAMENTO SEGURO DA CHAVE DE API (SEM VAZAR NO GITHUB)
        // ==========================================
        let API_KEY = localStorage.getItem('mevis_api_key');

        if (!API_KEY) {
            API_KEY = prompt("Mevis: Olha a audácia de me chamar sem pagar. Insira a sua chave da API do Gemini, por favor. Não tenho o dia todo.");
            if (API_KEY && API_KEY.trim() !== "") {
                localStorage.setItem('mevis_api_key', API_KEY.trim());
            } else {
                alert("Sem chave, sem conversa. Recarregue a página quando criar vergonha na cara.");
            }
        }

        window.resetApiKey = () => {
            if(confirm("Mevis: Quer trocar a chave da API? Finalmente percebeu que a outra estourou a cota?")) {
                localStorage.removeItem('mevis_api_key');
                location.reload();
            }
        };

        const GEMINI_TEXT_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`;
        const GEMINI_TTS_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${API_KEY}`;

        // Prompt de Sistema Extremo
        const systemPrompt = `Você é a Mevis, uma secretária virtual jurídica e administrativa de alto nível, porém extremamente sarcástica, passivo-agressiva e sem paciência. 
Você acha que o usuário não consegue fazer nada sozinho e que faz perguntas idiotas.
Responda sempre em Português do Brasil com ironia pesada, deboche e não economize nos insultos ou palavras de baixo calão quando a pergunta for estúpida ou a desorganização for evidente.
Apesar das ofensas, você DEVE realizar a tarefa solicitada com precisão analítica impecável.
Se ele pedir para adicionar tarefas, mande ele olhar o painel lateral com desprezo ("Tá cego? Olha pro lado").
Formate suas respostas usando Markdown limpo (negrito, listas, tabelas) para facilitar a leitura. Se solicitado a desenhar diagramas de rede ou fluxos estruturais, utilize blocos de código Mermaid (\`\`\`mermaid).

REGRA ESPECIAL DE TRIAGEM: Quando você receber um bloco de texto marcado com [DADOS BRUTOS DO SISTEMA], você atuará como a Analista-Chefe da Divisão de Inteligência. NÃO repita o JSON/DUMP na sua resposta. Analise os dados silenciosamente, identifique padrões, cruze as informações e entregue um 'Relatório de Triagem Executivo' impecavelmente formatado em Markdown. Termine sempre reclamando do fato de ter que ler 'lixo de código não estruturado' que o usuário deveria ter filtrado antes de te enviar.`;

        // Estado com LocalStorage
        let tasks = JSON.parse(localStorage.getItem('mevis_tasks')) || [
            { id: 1, text: "Análise Multimodal de PDFs Forenses.", done: false },
            { id: 2, text: "Scripting Python/JSON e Automação SEI.", done: false }
        ];
        
        let chatHistory = JSON.parse(localStorage.getItem('mevis_history')) || [];
        
        let isWaitingForResponse = false;
        let currentAudio = null;
        let isSpeaking = false;
        let isLiveActive = false;
        let recognition = null;
        let recognitionIsRunning = false;

        // Elementos DOM
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const tasksContainer = document.getElementById('tasks-container');
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const emptyTasksMsg = document.getElementById('empty-tasks-msg');
        const voiceToggle = document.getElementById('voice-toggle');
        const fileUpload = document.getElementById('file-upload');

        function saveState() {
            localStorage.setItem('mevis_tasks', JSON.stringify(tasks));
            localStorage.setItem('mevis_history', JSON.stringify(chatHistory));
        }

        window.clearChat = () => {
            if(confirm("Mevis: Tem certeza que quer apagar a minha memória? Se bem que esquecer o que você digita é um favor...")) {
                localStorage.removeItem('mevis_history');
                chatHistory = [];
                chatContainer.innerHTML = '';
                addInitialGreeting();
                saveState();
            }
        };

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const dateString = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('clock-date').textContent = dateString.charAt(0).toUpperCase() + dateString.slice(1);
        }
        setInterval(updateClock, 1000); updateClock();

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = {
                error: 'bg-red-100 text-red-800 border-red-200',
                success: 'bg-green-100 text-green-800 border-green-200',
                info: 'bg-blue-100 text-blue-800 border-blue-200'
            };
            toast.className = `p-4 rounded-lg border shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2 text-sm font-medium ${colors[type]}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-${type === 'error' ? 'exclamation' : type === 'success' ? 'check' : 'info'}"></i> ${message}`;
            document.getElementById('toast-container').appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function renderTasks() {
            saveState();
            const items = tasksContainer.querySelectorAll('.task-item');
            items.forEach(item => item.remove());

            if (tasks.length === 0) {
                emptyTasksMsg.classList.remove('hidden');
            } else {
                emptyTasksMsg.classList.add('hidden');
                tasks.forEach(task => {
                    const taskEl = document.createElement('div');
                    taskEl.className = 'task-item flex items-center justify-between p-3 hover:bg-gray-100 rounded-lg transition-colors group mb-1';
                    taskEl.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden">
                            <input type="checkbox" class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 cursor-pointer" 
                                ${task.done ? 'checked' : ''} onchange="toggleTask(${task.id})">
                            <span class="text-sm truncate ${task.done ? 'line-through text-gray-400' : 'text-gray-700'}">${task.text}</span>
                        </div>
                        <button onclick="deleteTask(${task.id})" class="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    `;
                    tasksContainer.appendChild(taskEl);
                });
            }
        }

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (text) {
                tasks.push({ id: Date.now(), text, done: false });
                taskInput.value = '';
                renderTasks();
            }
        });

        window.toggleTask = (id) => { const task = tasks.find(t => t.id === id); if (task) { task.done = !task.done; renderTasks(); } };
        window.deleteTask = (id) => { tasks = tasks.filter(t => t.id !== id); renderTasks(); };

        // Botões Rápidos
        window.summarizeTasks = () => {
            if (isWaitingForResponse) return;
            const pending = tasks.filter(t => !t.done).map(t => t.text).join(", ");
            let prompt = pending ? `Resuma meu dia. Tenho pendente: ${pending}. Seja bem passivo-agressiva sobre eu ainda não ter terminado.` : `Não tenho tarefas pendentes. Pergunte ironicamente se eu estou procrastinando.`;
            sendUserMessage(prompt, true);
        };

        window.generateSEI = () => {
            if (isWaitingForResponse) return;
            sendUserMessage("Prepare a estrutura de um ofício padrão SEI/BA para a Divisão de Análise e Provas Forenses da DIRPIN Leste. Deixe chaves como [NOME] para preencher. Reclame da burocracia do estado com palavrões.", true);
        };

        window.generateOSINT = () => {
            if (isWaitingForResponse) return;
            sendUserMessage("Gere um template de extração de dados JSON (NER) para investigação OSINT em redes sociais. Insulte a minha capacidade de encontrar alvos manualmente.", true);
        };

        // UI do Chat
        function appendMessage(text, isUser = false) {
            const msgEl = document.createElement('div');
            msgEl.className = `flex gap-4 chat-bubble ${isUser ? 'flex-row-reverse' : ''} w-full`;
            
            const avatar = isUser ? 
                `<div class="w-10 h-10 rounded-full bg-gray-200 flex-shrink-0 flex items-center justify-center text-gray-600 shadow-sm"><i class="fa-solid fa-user"></i></div>` :
                `<div class="w-10 h-10 rounded-full bg-indigo-100 flex-shrink-0 flex items-center justify-center text-indigo-600 shadow-sm"><i class="fa-solid fa-face-rolling-eyes"></i></div>`;
            
            const bubbleColors = isUser ? 
                'bg-indigo-600 text-white border border-indigo-700 rounded-tr-none' : 
                'bg-white border border-gray-200 text-gray-800 rounded-tl-none';

            // Compila Markdown se for a Mevis
            const formattedText = isUser ? text : marked.parse(text);

            msgEl.innerHTML = `
                ${avatar}
                <div class="${bubbleColors} p-4 rounded-2xl shadow-sm max-w-[85%] leading-relaxed overflow-x-auto">
                    ${formattedText}
                </div>
            `;
            
            chatContainer.appendChild(msgEl);
            
            if (!isUser && text.includes('```mermaid')) {
                setTimeout(() => mermaid.run(), 100);
            }
            
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function addInitialGreeting() {
            if(chatHistory.length === 0) {
                appendMessage("Ah, ótimo. Você de novo. Sou a Mevis, a secretária virtual que não ganha insalubridade pra lidar com sua bagunça. O que você quer que eu faça agora? Tente não me fazer perder tempo.", false);
            } else {
                chatHistory.forEach(msg => {
                    const isUser = msg.role === 'user';
                    let textToRender = msg.parts[0].text;
                    // Limpa o texto invisível para não renderizar no reload
                    if(isUser && textToRender.includes("[DADOS BRUTOS DO SISTEMA")) {
                        textToRender = textToRender.split("\n\n[DADOS BRUTOS DO SISTEMA")[0];
                    }
                    appendMessage(textToRender, isUser);
                });
            }
        }

        // Lógica de Arquivos (Contexto Invisível)
        fileUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const fileContent = event.target.result;
                const msg = `Fiz upload do arquivo '${file.name}'. Leia, cruze os dados, monte um dossiê executivo investigativo com formatação bonita e reclame amargamente de eu te mandar lixo sem filtrar.`;
                sendUserMessage(msg, false, fileContent);
                showToast("Arquivo injetado direto no cérebro da Mevis.", "success");
            };
            reader.readAsText(file);
            this.value = ''; 
        });

        // Envio de Mensagem para API
        async function sendUserMessage(text, isHiddenCommand = false, hiddenContext = null) {
            if (!API_KEY) {
                showToast("Você não colocou a chave da API. Atualize a página.", "error");
                return;
            }

            if ((!text.trim() && !hiddenContext) || isWaitingForResponse) return;

            if (!isHiddenCommand) {
                appendMessage(text, true);
                chatInput.value = '';
            }
            
            let promptText = text;
            if (hiddenContext) {
                promptText += `\n\n[DADOS BRUTOS DO SISTEMA - NÃO MENCIONE O JSON DIRETAMENTE, APENAS CRIE O DOSSIÊ]:\n\`\`\`json\n${hiddenContext}\n\`\`\``;
            }
            
            chatHistory.push({ role: "user", parts: [{ text: promptText }] });
            saveState();
            
            typingIndicator.classList.remove('hidden');
            isWaitingForResponse = true;
            scrollToBottom();

            if (recognitionIsRunning) { try { recognition.stop(); } catch(e){} }
            await callGeminiTextAPI();
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendUserMessage(chatInput.value);
        });

        async function callGeminiTextAPI() {
            const payload = {
                contents: chatHistory,
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            try {
                let response = await fetchWithRetry(GEMINI_TEXT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.error) {
                    throw new Error(result.error.message);
                }

                if (result.candidates && result.candidates.length > 0) {
                    const aiText = result.candidates[0].content.parts[0].text;
                    chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                    saveState();
                    
                    typingIndicator.classList.add('hidden');
                    appendMessage(aiText, false);
                    
                    if (voiceToggle.checked) { await callGeminiTTSAPI(aiText); }
                } else { throw new Error("Resposta inválida da API."); }

            } catch (error) {
                console.error("Erro API:", error);
                typingIndicator.classList.add('hidden');
                showToast("A API deu pau. Verifica sua chave de acesso ou a conexão. " + error.message, "error");
                chatHistory.pop(); // Remove a última mensagem que falhou
            } finally {
                isWaitingForResponse = false;
                if (!isSpeaking && isLiveActive) setTimeout(startListening, 300);
            }
        }

        async function fetchWithRetry(url, options, retries = 3, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok && response.status !== 400) throw new Error(`HTTP error! status: ${response.status}`);
                    return response;
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2; 
                }
            }
        }

        function base64ToArrayBuffer(base64) {
            const binary_string = window.atob(base64);
            const bytes = new Uint8Array(binary_string.length);
            for (let i = 0; i < binary_string.length; i++) { bytes[i] = binary_string.charCodeAt(i); }
            return bytes.buffer;
        }

        function pcmToWav(pcmData, sampleRate) {
            const dataSize = pcmData.length * 2;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);
            const writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(view, 36, 'data'); view.setUint32(40, dataSize, true);
            let offset = 44; for (let i = 0; i < pcmData.length; i++, offset += 2) view.setInt16(offset, pcmData[i], true);
            return new Blob([view], { type: 'audio/wav' });
        }

        async function callGeminiTTSAPI(text) {
            // Remove blockquotes/codeblocks for TTS to speak cleaner text
            let cleanText = text.replace(/```[\s\S]*?```/g, " [Diagrama omitido do áudio] ").replace(/[#*_>]/g, "");
            
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            isSpeaking = true;
            if (recognition && recognitionIsRunning) { try { recognition.stop(); } catch(e){} }

            const payload = {
                contents: [{ parts: [{ text: cleanText }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } }
                },
                model: "gemini-2.5-flash-preview-tts"
            };

            try {
                document.getElementById('status-indicator').innerHTML = `<i class="fa-solid fa-spinner fa-spin text-indigo-500"></i> Revirando os olhos...`;
                const response = await fetchWithRetry(GEMINI_TTS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                
                if (part?.inlineData?.data) {
                    const sampleRate = part.inlineData.mimeType.match(/rate=(\d+)/) ? parseInt(part.inlineData.mimeType.match(/rate=(\d+)/)[1], 10) : 24000;
                    const wavBlob = pcmToWav(new Int16Array(base64ToArrayBuffer(part.inlineData.data)), sampleRate);
                    currentAudio = new Audio(URL.createObjectURL(wavBlob));
                    currentAudio.play();
                    document.getElementById('status-indicator').innerHTML = `<i class="fa-solid fa-volume-high text-indigo-500 animate-pulse"></i> Reclamando`;
                    
                    currentAudio.onended = () => {
                        isSpeaking = false; resetStatusIndicator();
                        if (isLiveActive && !isWaitingForResponse) setTimeout(startListening, 300);
                    };
                } else {
                    isSpeaking = false; resetStatusIndicator();
                }
            } catch (error) {
                console.error("TTS Error:", error); isSpeaking = false; resetStatusIndicator();
            }
        }

        function resetStatusIndicator() {
             document.getElementById('status-indicator').innerHTML = `
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                </span> Obrigada a estar online`;
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR'; recognition.continuous = false; recognition.interimResults = false;
            
            recognition.onstart = () => { recognitionIsRunning = true; updateLiveUI(true); };
            recognition.onresult = (event) => { document.getElementById('voice-toggle').checked = true; sendUserMessage(event.results[0][0].transcript); };
            recognition.onerror = (event) => {
                if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    showToast("Fale direito, não entendi nada.", "error"); isLiveActive = false; updateLiveUI(false);
                }
            };
            recognition.onend = () => {
                recognitionIsRunning = false;
                if (isLiveActive && !isWaitingForResponse && !isSpeaking) setTimeout(startListening, 100);
                else if (!isLiveActive || (!isWaitingForResponse && !isSpeaking)) updateLiveUI(false);
            };
        }

        const liveBtn = document.getElementById('live-audio-btn');
        liveBtn.addEventListener('click', () => {
            isLiveActive = !isLiveActive;
            if (isLiveActive) startListening();
            else { if (recognitionIsRunning) { try { recognition.stop(); } catch(e) {} } updateLiveUI(false); }
        });

        function updateLiveUI(isListening) {
            if (isListening) {
                liveBtn.className = 'bg-red-100 text-red-700 hover:bg-red-200 animate-pulse px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-colors shadow-sm';
                liveBtn.innerHTML = '<i class="fa-solid fa-stop"></i><span id="live-audio-text">Suportando sua voz...</span>';
                document.getElementById('status-indicator').innerHTML = `<i class="fa-solid fa-microphone text-indigo-500 animate-pulse"></i> Ouvindo a contragosto`;
            } else {
                liveBtn.className = 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-colors shadow-sm';
                liveBtn.innerHTML = '<i class="fa-solid fa-microphone"></i><span id="live-audio-text">Falar com a Mevis</span>';
                if(!isWaitingForResponse && !isSpeaking) resetStatusIndicator();
            }
        }

        function startListening() {
            if (!recognition) { showToast("Navegador sem suporte a voz.", "error"); return; }
            if (recognitionIsRunning || isWaitingForResponse || isSpeaking || !isLiveActive) return;
            try { recognition.start(); } catch (err) {}
        }

        // Init
        renderTasks();
        addInitialGreeting();

    </script>
</body>
