    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Loading Dots Animation */
        .dot-typing {
            position: relative;
            left: -9999px;
            width: 8px;
            height: 8px;
            border-radius: 5px;
            background-color: #6366f1;
            color: #6366f1;
            box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1;
            animation: dot-typing 1.5s infinite linear;
        }

        @keyframes dot-typing {
            0% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            16.667% { box-shadow: 9984px -8px 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            33.333% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            50% { box-shadow: 9984px 0 0 0 #6366f1, 9999px -8px 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            66.667% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            83.333% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px -8px 0 0 #6366f1; }
            100% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
        }

        .chat-bubble { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Markdown Styles */
        .chat-bubble p { margin-bottom: 0.75rem; }
        .chat-bubble p:last-child { margin-bottom: 0; }
        .chat-bubble ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .chat-bubble ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .chat-bubble pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; font-size: 0.875rem; }
        .chat-bubble code { font-family: monospace; background: #e2e8f0; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.875em; color: #b91c1c; }
        .chat-bubble pre code { background: transparent; color: inherit; padding: 0; }
        .chat-bubble table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.875rem; }
        .chat-bubble th, .chat-bubble td { border: 1px solid #cbd5e1; padding: 0.5rem; text-align: left; }
        .chat-bubble th { background-color: #f1f5f9; font-weight: 600; }
        .chat-bubble blockquote { border-left: 4px solid #cbd5e1; padding-left: 1rem; color: #64748b; font-style: italic; margin: 1rem 0; }

        /* Animações do Rosto da Mevis */
        .eye { animation: blink 4s infinite; }
        #mevis-mouth {
            transform-origin: 50px 70px;
            transition: transform 0.05s;
        }
        .speaking #mevis-mouth {
            animation: talk-mouth 0.15s infinite alternate;
        }
        @keyframes blink {
            0%, 96%, 98%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }
        @keyframes talk-mouth {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(3.5); }
        }
    </style>
</head>

    <script type="module">
        // ==========================================
        // CONFIGURAÇÃO DE SEGURANÇA E OAUTH (GMAIL)
        // ==========================================
        const GOOGLE_CLIENT_ID = 'SEU_CLIENT_ID_AQUI.apps.googleusercontent.com'; // Cole seu Client ID do Google Cloud aqui se quiser usar a integração do Gmail
        const SCOPES = 'https://www.googleapis.com/auth/gmail.readonly';

        let tokenClient;
        let accessToken = localStorage.getItem('google_access_token') || null;

        window.onload = function () {
            if (window.google) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: SCOPES,
                    callback: (response) => {
                        if (response.error !== undefined) {
                            showToast("Falha na autenticação do Google.", "error");
                            return;
                        }
                        accessToken = response.access_token;
                        localStorage.setItem('google_access_token', accessToken);
                        updateAuthUI(true);
                        showToast("Gmail conectado com sucesso!", "success");
                    },
                });
            }
            if (accessToken) {
                updateAuthUI(true);
            }
        };

        window.handleAuthClick = () => {
            if (!tokenClient) {
                showToast("A biblioteca do Google ainda está carregando. Tente novamente em instantes.", "error");
                return;
            }
            tokenClient.requestAccessToken({ prompt: 'consent' });
        };

        function updateAuthUI(isConnected) {
            const btnText = document.getElementById('auth-btn-text');
            const statusLabel = document.getElementById('auth-status-label');
            const authBtn = document.getElementById('google-auth-btn');
            
            if (isConnected) {
                btnText.textContent = "Gmail Conectado";
                statusLabel.textContent = "Conta Conectada";
                statusLabel.className = "text-xs text-green-600 font-medium mt-1";
                authBtn.className = "w-full flex items-center justify-center gap-2 bg-green-50 text-green-700 py-2 px-4 rounded-lg text-sm font-medium border border-green-200 cursor-default";
            }
        }

        // Função para Buscar E-mails do Gmail
        window.fetchGmailMessages = async () => {
            if (!accessToken) {
                showToast("Por favor, conecte sua conta do Google primeiro.", "error");
                handleAuthClick();
                return;
            }

            showToast("Acessando sua caixa de entrada...", "info");

            try {
                const listRes = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=5', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                
                if (listRes.status === 401) {
                    localStorage.removeItem('google_access_token');
                    accessToken = null;
                    throw new Error("Sessão do Google expirada. Conecte novamente.");
                }

                const listData = await listRes.json();
                if (!listData.messages || listData.messages.length === 0) {
                    sendUserMessage("Verifiquei meus e-mails recentes, mas a caixa de entrada está vazia.", true);
                    return;
                }

                let emailsDump = [];
                for (const msg of listData.messages) {
                    const detailRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${msg.id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    const detail = await detailRes.json();
                    const headers = detail.payload.headers;
                    const subject = headers.find(h => h.name === 'Subject')?.value || 'Sem Assunto';
                    const sender = headers.find(h => h.name === 'From')?.value || 'Desconhecido';
                    const date = headers.find(h => h.name === 'Date')?.value || '';

                    emailsDump.push({ remetente: sender, assunto: subject, data: date, snippet: detail.snippet });
                }

                sendUserMessage("Por favor, analise meus e-mails recentes e elabore um relatório executivo de triagem priorizando o que for importante.", false, JSON.stringify(emailsDump, null, 2));

            } catch (error) {
                console.error("Erro Gmail API:", error);
                showToast("Erro ao ler e-mails: " + error.message, "error");
            }
        };

        // ==========================================
        // GERENCIAMENTO DA CHAVE DE API DO GEMINI
        // ==========================================
        // A CHAVE DE API INSERIDA CORRETAMENTE:
        const API_KEY = "AQ.Ab8RN6Jo-7gqmxSzOHA1V9w0F4__FUV0zl4WLh386ukxxqkVIg";

        const GEMINI_TEXT_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
        const GEMINI_TTS_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${API_KEY}`;

        const systemPrompt = `Você é a Mevis, uma assistente virtual jurídica e administrativa altamente capacitada e profissional.
Responda sempre em Português do Brasil de forma clara, objetiva e educada. Seu foco principal é a eficiência e a resolução precisa de problemas.
Você DEVE realizar a tarefa solicitada com precisão analítica impecável.
Formate suas respostas usando Markdown limpo (negrito, listas, tabelas) para facilitar a leitura. Se solicitado a desenhar diagramas de rede ou fluxos estruturais, utilize blocos de código Mermaid (\`\`\`mermaid).

REGRA ESPECIAL DE TRIAGEM: Quando você receber um bloco de texto marcado com [DADOS BRUTOS DO SISTEMA], você atuará como Analista de Inteligência. NÃO repita o JSON/DUMP na sua resposta. Analise os dados silenciosamente, identifique padrões, cruze as informações e entregue um 'Relatório de Triagem Executivo' impecavelmente formatado em Markdown.`;

        let tasks = JSON.parse(localStorage.getItem('mevis_tasks')) || [
            { id: 1, text: "Análise Multimodal de PDFs Forenses.", done: false },
            { id: 2, text: "Scripting Python/JSON e Automação SEI.", done: false }
        ];
        
        let chatHistory = JSON.parse(localStorage.getItem('mevis_history')) || [];
        
        let isWaitingForResponse = false;
        let currentAudio = null;
        let isSpeaking = false;
        let isLiveActive = false;
        let recognition = null;
        let recognitionIsRunning = false;

        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const tasksContainer = document.getElementById('tasks-container');
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const emptyTasksMsg = document.getElementById('empty-tasks-msg');
        const voiceToggle = document.getElementById('voice-toggle');
        const fileUpload = document.getElementById('file-upload');
        const avatarContainer = document.getElementById('avatar-container');

        function saveState() {
            localStorage.setItem('mevis_tasks', JSON.stringify(tasks));
            localStorage.setItem('mevis_history', JSON.stringify(chatHistory));
        }

        window.clearChat = () => {
            if(confirm("Tem certeza que deseja limpar o histórico de conversas?")) {
                localStorage.removeItem('mevis_history');
                chatHistory = [];
                chatContainer.innerHTML = '';
                addInitialGreeting();
                saveState();
            }
        };

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const dateString = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('clock-date').textContent = dateString.charAt(0).toUpperCase() + dateString.slice(1);
        }
        setInterval(updateClock, 1000); updateClock();

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = {
                error: 'bg-red-100 text-red-800 border-red-200',
                success: 'bg-green-100 text-green-800 border-green-200',
                info: 'bg-blue-100 text-blue-800 border-blue-200'
            };
            toast.className = `p-4 rounded-lg border shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2 text-sm font-medium ${colors[type]}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-${type === 'error' ? 'exclamation' : type === 'success' ? 'check' : 'info'}"></i> ${message}`;
            document.getElementById('toast-container').appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function renderTasks() {
            saveState();
            const items = tasksContainer.querySelectorAll('.task-item');
            items.forEach(item => item.remove());

            if (tasks.length === 0) {
                emptyTasksMsg.classList.remove('hidden');
            } else {
                emptyTasksMsg.classList.add('hidden');
                tasks.forEach(task => {
                    const taskEl = document.createElement('div');
                    taskEl.className = 'task-item flex items-center justify-between p-3 hover:bg-gray-100 rounded-lg transition-colors group mb-1';
                    taskEl.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden">
                            <input type="checkbox" class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 cursor-pointer" 
                                ${task.done ? 'checked' : ''} onchange="toggleTask(${task.id})">
                            <span class="text-sm truncate ${task.done ? 'line-through text-gray-400' : 'text-gray-700'}">${task.text}</span>
                        </div>
                        <button onclick="deleteTask(${task.id})" class="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    `;
                    tasksContainer.appendChild(taskEl);
                });
            }
        }

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (text) {
                tasks.push({ id: Date.now(), text, done: false });
                taskInput.value = '';
                renderTasks();
            }
        });

        window.toggleTask = (id) => { const task = tasks.find(t => t.id === id); if (task) { task.done = !task.done; renderTasks(); } };
        window.deleteTask = (id) => { tasks = tasks.filter(t => t.id !== id); renderTasks(); };

        window.summarizeTasks = () => {
            if (isWaitingForResponse) return;
            const pending = tasks.filter(t => !t.done).map(t => t.text).join(", ");
            let prompt = pending ? `Por favor, resuma minhas tarefas pendentes: ${pending}.` : `Não tenho tarefas pendentes. Como posso organizar meu dia?`;
            sendUserMessage(prompt, true);
        };

        window.generateSEI = () => {
            if (isWaitingForResponse) return;
            sendUserMessage("Prepare a estrutura de um ofício padrão SEI/BA para a Divisão de Análise e Provas Forenses da DIRPIN Leste. Deixe chaves como [NOME] para preencher.", true);
        };

        window.generateOSINT = () => {
            if (isWaitingForResponse) return;
            sendUserMessage("Gere um template de extração de dados JSON (NER) para investigação OSINT em redes sociais.", true);
        };

        function appendMessage(text, isUser = false) {
            const msgEl = document.createElement('div');
            msgEl.className = `flex gap-4 chat-bubble ${isUser ? 'flex-row-reverse' : ''} w-full`;
            
            const avatar = isUser ? 
                `<div class="w-10 h-10 rounded-full bg-gray-200 flex-shrink-0 flex items-center justify-center text-gray-600 shadow-sm"><i class="fa-solid fa-user"></i></div>` :
                `<div class="w-10 h-10 rounded-full bg-indigo-100 flex-shrink-0 flex items-center justify-center text-indigo-600 shadow-sm"><i class="fa-solid fa-robot"></i></div>`;
            
            const bubbleColors = isUser ? 
                'bg-indigo-600 text-white border border-indigo-700 rounded-tr-none' : 
                'bg-white border border-gray-200 text-gray-800 rounded-tl-none';

            const formattedText = isUser ? text : marked.parse(text);

            msgEl.innerHTML = `
                ${avatar}
                <div class="${bubbleColors} p-4 rounded-2xl shadow-sm max-w-[85%] leading-relaxed overflow-x-auto">
                    ${formattedText}
                </div>
            `;
            
            chatContainer.appendChild(msgEl);
            if (!isUser && text.includes('```mermaid')) { setTimeout(() => mermaid.run(), 100); }
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function addInitialGreeting() {
            if(chatHistory.length === 0) {
                appendMessage("Olá, sou a Mevis, sua assistente virtual administrativa. Conecte sua conta do Google no painel lateral para que eu possa gerenciar seus e-mails e auxiliar nas suas tarefas.", false);
            } else {
                chatHistory.forEach(msg => {
                    const isUser = msg.role === 'user';
                    let textToRender = "";
                    msg.parts.forEach(part => {
                        if (part.text) {
                            textToRender += part.text + " ";
                        }
                    });

                    if(isUser && textToRender.includes("[DADOS BRUTOS DO SISTEMA")) {
                        textToRender = textToRender.split("\n\n[DADOS BRUTOS DO SISTEMA")[0];
                    }
                    if (textToRender.trim()) {
                        appendMessage(textToRender, isUser);
                    }
                });
            }
        }

        // ==========================================
        // LEITURA INTELIGENTE DE PDF, DOCX, EXCEL E MIDIAS
        // ==========================================
        fileUpload.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const fileExt = file.name.split('.').pop().toLowerCase();
            const isText = file.type.startsWith('text/') || ['json','md','csv','txt'].includes(fileExt);
            const isExcel = ['xls', 'xlsx'].includes(fileExt);
            const isWord = ['docx'].includes(fileExt);

            showToast("Processando arquivo...", "info");

            try {
                if (isText) {
                    const text = await file.text();
                    const msg = `Fiz upload do arquivo '${file.name}'. Leia os dados e elabore um relatório.`;
                    sendUserMessage(msg, false, text);
                    showToast("Arquivo de texto enviado.", "success");
                    
                } else if (isExcel) {
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                    const firstSheet = workbook.SheetNames[0];
                    const csvData = XLSX.utils.sheet_to_csv(workbook.Sheets[firstSheet]);
                    
                    const msg = `Fiz upload da planilha Excel '${file.name}'. Analise as colunas e me dê os insights principais.`;
                    sendUserMessage(msg, false, csvData);
                    showToast("Planilha Excel enviada.", "success");
                    
                } else if (isWord) {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    
                    const msg = `Fiz upload do documento Word '${file.name}'. Faça um resumo executivo deste conteúdo.`;
                    sendUserMessage(msg, false, result.value);
                    showToast("Documento Word enviado.", "success");
                    
                } else {
                    // PDF, Imagens, Áudios e Vídeos (via Base64 inlineData)
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const base64Data = event.target.result.split(',')[1];
                        const msg = `Fiz upload da mídia/PDF '${file.name}'. Analise o anexo e detalhe o conteúdo.`;
                        
                        let mime = file.type || "application/octet-stream";
                        if (fileExt === 'pdf') mime = "application/pdf";

                        const filePart = { inlineData: { data: base64Data, mimeType: mime } };
                        sendUserMessage(msg, false, null, filePart);
                        showToast("Arquivo de mídia/PDF enviado.", "success");
                    };
                    reader.readAsDataURL(file);
                }
            } catch (error) {
                console.error("Erro ao ler arquivo:", error);
                showToast("Falha ao ler o conteúdo do arquivo.", "error");
            }
            
            this.value = ''; // Limpa o input
        });

        // ==========================================
        // ENVIO DE MENSAGENS E INTEGRAÇÃO GEMINI
        // ==========================================
        async function sendUserMessage(text, isHiddenCommand = false, hiddenContext = null, filePart = null) {
            if (!API_KEY) {
                showToast("A chave da API está ausente.", "error");
                return;
            }

            if ((!text.trim() && !hiddenContext && !filePart) || isWaitingForResponse) return;

            if (!isHiddenCommand) {
                appendMessage(text, true);
                chatInput.value = '';
            }
            
            let promptText = text;
            if (hiddenContext) {
                promptText += `\n\n[DADOS BRUTOS DO SISTEMA - NÃO MENCIONE O JSON DIRETAMENTE, APENAS CRIE O DOSSIÊ]:\n\`\`\`json\n${hiddenContext}\n\`\`\``;
            }
            
            const parts = [{ text: promptText }];
            if (filePart) {
                parts.push(filePart);
            }
            
            chatHistory.push({ role: "user", parts: parts });
            saveState();
            
            typingIndicator.classList.remove('hidden');
            isWaitingForResponse = true;
            scrollToBottom();

            if (recognitionIsRunning) { try { recognition.stop(); } catch(e){} }
            await callGeminiTextAPI();
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendUserMessage(chatInput.value);
        });

        async function callGeminiTextAPI() {
            const payload = {
                contents: chatHistory,
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            try {
                let response = await fetchWithRetry(GEMINI_TEXT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.error) throw new Error(result.error.message);

                if (result.candidates && result.candidates.length > 0) {
                    const aiText = result.candidates[0].content.parts[0].text;
                    chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                    saveState();
                    
                    typingIndicator.classList.add('hidden');
                    appendMessage(aiText, false);
                    
                    if (voiceToggle.checked) { await callGeminiTTSAPI(aiText); }
                } else { throw new Error("Resposta inválida da API."); }

            } catch (error) {
                console.error("Erro API:", error);
                typingIndicator.classList.add('hidden');
                showToast("Erro na comunicação com a API. Verifique a sua chave.", "error");
                chatHistory.pop(); // Remove a pergunta caso a API falhe para permitir nova tentativa
            } finally {
                isWaitingForResponse = false;
                if (!isSpeaking && isLiveActive) setTimeout(startListening, 300);
            }
        }

        async function fetchWithRetry(url, options, retries = 3, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok && response.status !== 400) throw new Error(`HTTP error! status: ${response.status}`);
                    return response;
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2; 
                }
            }
        }

        function base64ToArrayBuffer(base64) {
            const binary_string = window.atob(base64);
            const bytes = new Uint8Array(binary_string.length);
            for (let i = 0; i < binary_string.length; i++) { bytes[i] = binary_string.charCodeAt(i); }
            return bytes.buffer;
        }

        function pcmToWav(pcmData, sampleRate) {
            const dataSize = pcmData.length * 2;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);
            const writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(view, 36, 'data'); view.setUint32(40, dataSize, true);
            let offset = 44; for (let i = 0; i < pcmData.length; i++, offset += 2) view.setInt16(offset, pcmData[i], true);
            return new Blob([view], { type: 'audio/wav' });
        }

        async function callGeminiTTSAPI(text) {
            let cleanText = text.replace(/```[\s\S]*?```/g, " [Diagrama omitido do áudio] ").replace(/[#*_>]/g, "");
            
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            isSpeaking = true;
            avatarContainer.classList.add('speaking');
            
            if (recognition && recognitionIsRunning) { try { recognition.stop(); } catch(e){} }

            const payload = {
                contents: [{ parts: [{ text: cleanText }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } }
                },
                model: "gemini-2.5-flash-preview-tts"
            };

            try {
                document.getElementById('status-indicator').innerHTML = `<i class="fa-solid fa-spinner fa-spin text-indigo-500"></i> Processando áudio...`;
                const response = await fetchWithRetry(GEMINI_TTS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                
                if (part?.inlineData?.data) {
                    const sampleRate = part.inlineData.mimeType.match(/rate=(\d+)/) ? parseInt(part.inlineData.mimeType.match(/rate=(\d+)/)[1], 10) : 24000;
                    const wavBlob = pcmToWav(new Int16Array(base64ToArrayBuffer(part.inlineData.data)), sampleRate);
                    currentAudio = new Audio(URL.createObjectURL(wavBlob));
                    currentAudio.play();
                    document.getElementById('status-indicator').innerHTML = `<i class="fa-solid fa-volume-high text-indigo-500 animate-pulse"></i> Falando`;
                    
                    currentAudio.onended = () => {
                        isSpeaking = false; 
                        resetStatusIndicator();
                        avatarContainer.classList.remove('speaking');
                        if (isLiveActive && !isWaitingForResponse) setTimeout(startListening, 300);
                    };
                } else {
                    isSpeaking = false; 
                    resetStatusIndicator();
                    avatarContainer.classList.remove('speaking');
                }
            } catch (error) {
                console.error("TTS Error:", error); 
                isSpeaking = false; 
                resetStatusIndicator();
                avatarContainer.classList.remove('speaking');
            }
        }

        function resetStatusIndicator() {
             document.getElementById('status-indicator').innerHTML = `
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                </span> Sistema Online`;
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR'; recognition.continuous = false; recognition.interimResults = false;
            
            recognition.onstart = () => { recognitionIsRunning = true; updateLiveUI(true); };
            recognition.onresult = (event) => { document.getElementById('voice-toggle').checked = true; sendUserMessage(event.results[0][0].transcript); };
            recognition.onerror = (event) => {
                if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    showToast("Não foi possível compreender o áudio.", "error"); isLiveActive = false; updateLiveUI(false);
                }
            };
            recognition.onend = () => {
                recognitionIsRunning = false;
                if (isLiveActive && !isWaitingForResponse && !isSpeaking) setTimeout(startListening, 100);
                else if (!isLiveActive || (!isWaitingForResponse && !isSpeaking)) updateLiveUI(false);
            };
        }

        const liveBtn = document.getElementById('live-audio-btn');
        liveBtn.addEventListener('click', () => {
            isLiveActive = !isLiveActive;
            if (isLiveActive) startListening();
            else { if (recognitionIsRunning) { try { recognition.stop(); } catch(e) {} } updateLiveUI(false); }
        });

        function updateLiveUI(isListening) {
            if (isListening) {
                liveBtn.className = 'bg-red-100 text-red-700 hover:bg-red-200 animate-pulse px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-colors shadow-sm';
                liveBtn.innerHTML = '<i class="fa-solid fa-stop"></i><span id="live-audio-text">Ouvindo...</span>';
                document.getElementById('status-indicator').innerHTML = `<i class="fa-solid fa-microphone text-indigo-500 animate-pulse"></i> Captando áudio`;
            } else {
                liveBtn.className = 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-colors shadow-sm';
                liveBtn.innerHTML = '<i class="fa-solid fa-microphone"></i><span id="live-audio-text">Falar com a Mevis</span>';
                if(!isWaitingForResponse && !isSpeaking) resetStatusIndicator();
            }
        }

        function startListening() {
            if (!recognition) { showToast("Navegador sem suporte a voz.", "error"); return; }
            if (recognitionIsRunning || isWaitingForResponse || isSpeaking || !isLiveActive) return;
            try { recognition.start(); } catch (err) {}
        }

        renderTasks();
        addInitialGreeting();
    </script>
