<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mevis - Assistente Virtual</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Markdown e Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'default' });
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .dot-typing {
            position: relative; left: -9999px; width: 8px; height: 8px; border-radius: 5px;
            background-color: #6366f1; color: #6366f1;
            box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1;
            animation: dot-typing 1.5s infinite linear;
        }

        @keyframes dot-typing {
            0% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            16.667% { box-shadow: 9984px -8px 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            33.333% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            50% { box-shadow: 9984px 0 0 0 #6366f1, 9999px -8px 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            66.667% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
            83.333% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px -8px 0 0 #6366f1; }
            100% { box-shadow: 9984px 0 0 0 #6366f1, 9999px 0 0 0 #6366f1, 10014px 0 0 0 #6366f1; }
        }

        .chat-bubble { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-bubble p { margin-bottom: 0.75rem; }
        .chat-bubble p:last-child { margin-bottom: 0; }
        .chat-bubble ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .chat-bubble ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .chat-bubble pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; font-size: 0.875rem; }
        .chat-bubble code { font-family: monospace; background: #e2e8f0; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.875em; color: #b91c1c; }
        .chat-bubble pre code { background: transparent; color: inherit; padding: 0; }
        .chat-bubble table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.875rem; }
        .chat-bubble th, .chat-bubble td { border: 1px solid #cbd5e1; padding: 0.5rem; text-align: left; }
        .chat-bubble th { background-color: #f1f5f9; font-weight: 600; }
        .chat-bubble blockquote { border-left: 4px solid #cbd5e1; padding-left: 1rem; color: #64748b; font-style: italic; margin: 1rem 0; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col md:flex-row text-gray-800">

    <!-- Sidebar -->
    <aside class="w-full md:w-1/4 lg:w-1/5 bg-white border-r border-gray-200 flex flex-col justify-between shadow-sm z-10">
        <div class="p-6 flex flex-col items-center border-b border-gray-100">
            <div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-500 mb-4 shadow-inner">
                <i class="fa-solid fa-headset text-4xl"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800">Mevis</h2>
            <p class="text-sm text-gray-500">Assistente Corporativa</p>
        </div>

        <div class="p-4 flex-1 overflow-y-auto">
            <div class="mb-6 text-center">
                <div id="clock-time" class="text-3xl font-bold text-indigo-600 mb-1">--:--</div>
                <div id="clock-date" class="text-sm text-gray-500 font-medium">Carregando data...</div>
            </div>

            <div class="space-y-2 mb-6">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-1">Ações Rápidas</h3>
                <button id="btn-summarize" class="w-full flex items-center justify-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-2 px-4 rounded-lg transition-colors text-sm font-medium border border-indigo-100">
                    <i class="fa-solid fa-bolt"></i> Resumir Tarefas
                </button>
                <button id="btn-sei" class="w-full flex items-center justify-center gap-2 bg-slate-50 hover:bg-slate-100 text-slate-700 py-2 px-4 rounded-lg transition-colors text-sm font-medium border border-slate-200">
                    <i class="fa-solid fa-file-signature"></i> Estruturar Minuta SEI
                </button>
                <button id="btn-osint" class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white py-2 px-4 rounded-lg transition-colors text-sm font-medium border border-slate-700">
                    <i class="fa-solid fa-magnifying-glass-chart"></i> Prompt OSINT
                </button>
            </div>
            
            <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg border border-gray-100">
                <span class="text-sm font-medium text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-volume-high text-indigo-500"></i> Respostas por Voz
                </span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="voice-toggle" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                </label>
            </div>
        </div>
        
        <div class="p-4 bg-gray-50 text-xs text-center text-gray-400 border-t border-gray-200 flex flex-col gap-2">
            <span>Powered by Gemini 1.5</span>
            <div class="flex justify-center gap-4">
                <button id="btn-clear" class="text-red-500 hover:text-red-700 underline">Limpar Histórico</button>
                <button id="btn-reset-key" class="text-blue-500 hover:text-blue-700 underline">Alterar API Key</button>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col bg-white h-full relative">
        <header class="h-16 border-b border-gray-200 flex items-center px-6 justify-between bg-white/80 backdrop-blur-sm z-10">
            <h1 class="text-lg font-semibold text-gray-800 flex items-center gap-2">
                <i class="fa-regular fa-comments text-indigo-500"></i> Espaço de Trabalho
            </h1>
            <div class="flex items-center gap-3">
                <button id="live-audio-btn" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-colors shadow-sm">
                    <i class="fa-solid fa-microphone"></i>
                    <span id="live-audio-text">Falar com Mevis</span>
                </button>
                <div id="status-indicator" class="flex items-center gap-2 text-sm text-green-600 font-medium bg-green-50 px-3 py-1 rounded-full">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                    </span>
                    Sistema Online
                </div>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth bg-gray-50/50"></div>

        <div id="typing-indicator" class="hidden px-16 py-4 bg-gray-50/50">
            <div class="bg-gray-200 w-16 h-8 rounded-full flex items-center justify-center">
                <div class="dot-typing ml-3"></div>
            </div>
        </div>

        <div class="p-4 border-t border-gray-200 bg-white">
            <form id="chat-form" class="flex gap-2">
                <input type="file" id="file-upload" accept=".json,.txt,.csv,.md" class="hidden">
                <button type="button" id="btn-upload" class="bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-xl px-4 py-3 transition-colors flex items-center justify-center shadow-sm" title="Anexar arquivos de dados (JSON/TXT)">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="text" id="chat-input" placeholder="Digite sua instrução ou anexe um arquivo para análise..." 
                    class="flex-1 bg-gray-100 border-transparent focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 rounded-xl px-4 py-3 outline-none transition-all duration-200 text-gray-700">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-6 py-3 transition-colors flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Task Manager -->
    <aside class="w-full md:w-1/4 lg:w-72 bg-white border-l border-gray-200 flex flex-col h-full shadow-sm z-10">
        <div class="p-5 border-b border-gray-200 bg-gray-50">
            <h3 class="font-semibold text-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-list-check text-indigo-500"></i> Tarefas Pendentes
            </h3>
        </div>
        
        <div class="p-4 border-b border-gray-100">
            <form id="task-form" class="flex gap-2">
                <input type="text" id="task-input" placeholder="Adicionar nova tarefa..." 
                    class="flex-1 bg-gray-50 border border-gray-200 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-lg px-3 py-2 text-sm outline-none transition-all">
                <button type="submit" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg px-3 py-2 transition-colors">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>
        </div>

        <div class="flex-1 overflow-y-auto p-2">
            <div id="tasks-container"></div>
            <p id="empty-tasks-msg" class="text-sm text-gray-400 text-center mt-6 hidden">Nenhuma tarefa pendente no momento.</p>
        </div>
    </aside>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        // ==========================================
        // CONSTANTES E CONFIGURAÇÃO
        // ==========================================
        const SYSTEM_PROMPT = `Você é a Mevis, uma assistente virtual jurídica e administrativa altamente capacitada, prestativa e profissional. 
Responda sempre em Português do Brasil de forma clara, objetiva e educada. Seu objetivo é ajudar o usuário a maximizar a produtividade e resolver problemas com precisão técnica.
Formate suas respostas usando Markdown limpo (negrito, listas, tabelas) para facilitar a leitura. Se solicitado a desenhar diagramas de rede ou fluxos estruturais, utilize blocos de código Mermaid (\`\`\`mermaid).

REGRA ESPECIAL DE TRIAGEM: Quando você receber um bloco de texto marcado com [DADOS BRUTOS DO SISTEMA], atue como Analista-Chefe da Divisão de Inteligência. NÃO repita o JSON/DUMP na sua resposta. Analise os dados silenciosamente, identifique padrões e entregue um 'Relatório de Triagem Executivo' impecavelmente formatado em Markdown, com uma análise clara e acionável.`;

        const DEFAULT_TASKS = [
            { id: 1, text: "Revisar Análise Multimodal de PDFs Forenses.", done: false },
            { id: 2, text: "Configurar automação SEI via script Python.", done: false }
        ];

        // ==========================================
        // GERENCIAMENTO DE ESTADO E DOM
        // ==========================================
        const state = {
            apiKey: localStorage.getItem('mevis_api_key') || null,
            tasks: JSON.parse(localStorage.getItem('mevis_tasks')) || DEFAULT_TASKS,
            history: JSON.parse(localStorage.getItem('mevis_history')) || [],
            isWaitingForResponse: false,
            isSpeaking: false,
            isLiveActive: false,
            recognitionRunning: false,
            currentAudio: null,
            lastClockMinute: null
        };

        const DOM = {
            chatContainer: document.getElementById('chat-container'),
            chatForm: document.getElementById('chat-form'),
            chatInput: document.getElementById('chat-input'),
            typingIndicator: document.getElementById('typing-indicator'),
            tasksContainer: document.getElementById('tasks-container'),
            taskForm: document.getElementById('task-form'),
            taskInput: document.getElementById('task-input'),
            emptyTasksMsg: document.getElementById('empty-tasks-msg'),
            voiceToggle: document.getElementById('voice-toggle'),
            fileUpload: document.getElementById('file-upload'),
            btnUpload: document.getElementById('btn-upload'),
            liveBtn: document.getElementById('live-audio-btn'),
            toastContainer: document.getElementById('toast-container'),
            statusIndicator: document.getElementById('status-indicator')
        };

        let recognition = null;

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        function init() {
            checkApiKey();
            setupEventListeners();
            initSpeechRecognition();
            renderTasks();
            addInitialGreeting();
            setInterval(updateClock, 1000);
            updateClock();
        }

        function checkApiKey() {
            if (!state.apiKey) {
                const key = prompt("Por favor, insira a sua chave da API do Google Gemini para iniciar o sistema.");
                if (key && key.trim()) {
                    state.apiKey = key.trim();
                    localStorage.setItem('mevis_api_key', state.apiKey);
                } else {
                    alert("A chave da API é necessária para utilizar as funções da assistente. Recarregue a página para tentar novamente.");
                }
            }
        }

        function saveState() {
            localStorage.setItem('mevis_tasks', JSON.stringify(state.tasks));
            localStorage.setItem('mevis_history', JSON.stringify(state.history));
        }

        // ==========================================
        // UI & UTILITÁRIOS
        // ==========================================
        function updateClock() {
            const now = new Date();
            const currentMinute = now.getMinutes();
            if (state.lastClockMinute !== currentMinute) {
                state.lastClockMinute = currentMinute;
                document.getElementById('clock-time').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                const dateString = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
                document.getElementById('clock-date').textContent = dateString.charAt(0).toUpperCase() + dateString.slice(1);
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = {
                error: 'bg-red-100 text-red-800 border-red-200',
                success: 'bg-green-100 text-green-800 border-green-200',
                info: 'bg-blue-100 text-blue-800 border-blue-200'
            };
            toast.className = `p-4 rounded-lg border shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2 text-sm font-medium ${colors[type]}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-${type === 'error' ? 'exclamation' : type === 'success' ? 'check' : 'info'}"></i> ${message}`;
            DOM.toastContainer.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function scrollToBottom() {
            DOM.chatContainer.scrollTo({ top: DOM.chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function resetStatusIndicator() {
             DOM.statusIndicator.innerHTML = `
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                </span> Sistema Online`;
        }

        // ==========================================
        // CHAT DOM LOGIC
        // ==========================================
        function appendMessage(text, isUser = false) {
            const msgEl = document.createElement('div');
            msgEl.className = `flex gap-4 chat-bubble ${isUser ? 'flex-row-reverse' : ''} w-full`;
            
            const avatar = isUser ? 
                `<div class="w-10 h-10 rounded-full bg-gray-200 flex-shrink-0 flex items-center justify-center text-gray-600 shadow-sm"><i class="fa-solid fa-user"></i></div>` :
                `<div class="w-10 h-10 rounded-full bg-indigo-100 flex-shrink-0 flex items-center justify-center text-indigo-600 shadow-sm"><i class="fa-solid fa-headset"></i></div>`;
            
            const bubbleColors = isUser ? 
                'bg-indigo-600 text-white border border-indigo-700 rounded-tr-none' : 
                'bg-white border border-gray-200 text-gray-800 rounded-tl-none';

            const formattedText = isUser ? text : marked.parse(text);

            msgEl.innerHTML = `
                ${avatar}
                <div class="${bubbleColors} p-4 rounded-2xl shadow-sm max-w-[85%] leading-relaxed overflow-x-auto">
                    ${formattedText}
                </div>
            `;
            
            DOM.chatContainer.appendChild(msgEl);
            
            if (!isUser && text.includes('```mermaid')) {
                setTimeout(() => mermaid.run(), 100);
            }
            scrollToBottom();
        }

        function addInitialGreeting() {
            if(state.history.length === 0) {
                appendMessage("Olá! Sou a Mevis, sua assistente virtual. Como posso ajudar com suas tarefas e análises hoje?", false);
            } else {
                state.history.forEach(msg => {
                    const isUser = msg.role === 'user';
                    let textToRender = msg.parts[0].text;
                    if(isUser && textToRender.includes("[DADOS BRUTOS DO SISTEMA")) {
                        textToRender = textToRender.split("\n\n[DADOS BRUTOS DO SISTEMA")[0];
                    }
                    appendMessage(textToRender, isUser);
                });
            }
        }

        // ==========================================
        // GESTÃO DE TAREFAS
        // ==========================================
        function renderTasks() {
            saveState();
            if (state.tasks.length === 0) {
                DOM.emptyTasksMsg.classList.remove('hidden');
                DOM.tasksContainer.innerHTML = '';
            } else {
                DOM.emptyTasksMsg.classList.add('hidden');
                DOM.tasksContainer.innerHTML = state.tasks.map(task => `
                    <div class="flex items-center justify-between p-3 hover:bg-gray-100 rounded-lg transition-colors group mb-1" data-id="${task.id}">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <input type="checkbox" class="task-checkbox w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 cursor-pointer" 
                                ${task.done ? 'checked' : ''}>
                            <span class="text-sm truncate ${task.done ? 'line-through text-gray-400' : 'text-gray-700'}">${task.text}</span>
                        </div>
                        <button class="btn-delete-task text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1">
                            <i class="fa-solid fa-trash-can pointer-events-none"></i>
                        </button>
                    </div>
                `).join('');
            }
        }

        // ==========================================
        // COMUNICAÇÃO COM A API (GEMINI)
        // ==========================================
        async function fetchWithRetry(url, options, retries = 3, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    
                    // Se for erro 400 a 499 (como o 405), falha imediatamente para não ficar tentando à toa
                    if (!response.ok && response.status >= 400 && response.status < 500) {
                        throw new Error(`Erro HTTP ${response.status}: Verifique se a chave da API é válida e se o modelo configurado existe.`);
                    }
                    
                    // Se for erro de servidor 500+, tenta de novo
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (e) {
                    if (i === retries - 1 || e.message.includes("400") || e.message.includes("405") || e.message.includes("404")) {
                        throw e;
                    }
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2; 
                }
            }
        }

        async function sendUserMessage(text, isHiddenCommand = false, hiddenContext = null) {
            if (!state.apiKey) return showToast("Chave da API ausente.", "error");
            if ((!text.trim() && !hiddenContext) || state.isWaitingForResponse) return;

            if (!isHiddenCommand) {
                appendMessage(text, true);
                DOM.chatInput.value = '';
            }
            
            let promptText = text;
            if (hiddenContext) {
                promptText += `\n\n[DADOS BRUTOS DO SISTEMA - NÃO MENCIONE O JSON DIRETAMENTE, APENAS CRIE O DOSSIÊ]:\n\`\`\`json\n${hiddenContext}\n\`\`\``;
            }
            
            state.history.push({ role: "user", parts: [{ text: promptText }] });
            saveState();
            
            DOM.typingIndicator.classList.remove('hidden');
            state.isWaitingForResponse = true;
            scrollToBottom();

            safeStopRecognition();
            
            // CORREÇÃO AQUI: Mudado para o modelo gemini-1.5-flash oficial
            const url = `[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){state.apiKey}`;
            
            const payload = {
                contents: state.history,
                systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            };

            try {
                const response = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.error) throw new Error(result.error.message);

                if (result.candidates && result.candidates.length > 0) {
                    const aiText = result.candidates[0].content.parts[0].text;
                    state.history.push({ role: "model", parts: [{ text: aiText }] });
                    saveState();
                    
                    DOM.typingIndicator.classList.add('hidden');
                    appendMessage(aiText, false);
                    
                    if (DOM.voiceToggle.checked) { await callGeminiTTSAPI(aiText); }
                } else { 
                    throw new Error("Não foi possível processar a resposta da API."); 
                }

            } catch (error) {
                console.error("Erro na comunicação com a API:", error);
                DOM.typingIndicator.classList.add('hidden');
                showToast("Erro na API: " + error.message, "error");
                state.history.pop(); // Remove a pergunta do histórico se falhou
            } finally {
                state.isWaitingForResponse = false;
                if (!state.isSpeaking && state.isLiveActive) setTimeout(safeStartRecognition, 300);
            }
        }

        async function callGeminiTTSAPI(text) {
            let cleanText = text.replace(/```[\s\S]*?```/g, " [Diagrama de fluxo detalhado em formato de código.] ").replace(/[#*_>]/g, "");
            
            if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
            state.isSpeaking = true;
            safeStopRecognition();

            // CORREÇÃO AQUI: Mudado para o modelo gemini-1.5-flash oficial (O Gemini 1.5 aceita AUDIO como modalidade)
            const url = `[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){state.apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: cleanText }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } }
                }
            };

            try {
                DOM.statusIndicator.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-indigo-500"></i> Processando áudio...`;
                const response = await fetchWithRetry(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                
                // Extrai o áudio da resposta (se disponível)
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                
                if (part?.inlineData?.data) {
                    const sampleRate = part.inlineData.mimeType.match(/rate=(\d+)/) ? parseInt(part.inlineData.mimeType.match(/rate=(\d+)/)[1], 10) : 24000;
                    const wavBlob = pcmToWav(new Int16Array(base64ToArrayBuffer(part.inlineData.data)), sampleRate);
                    state.currentAudio = new Audio(URL.createObjectURL(wavBlob));
                    state.currentAudio.play();
                    DOM.statusIndicator.innerHTML = `<i class="fa-solid fa-volume-high text-indigo-500 animate-pulse"></i> Falando`;
                    
                    state.currentAudio.onended = () => {
                        state.isSpeaking = false; 
                        resetStatusIndicator();
                        if (state.isLiveActive && !state.isWaitingForResponse) setTimeout(safeStartRecognition, 300);
                    };
                } else {
                    // Se a API retornar texto em vez de áudio, desliga o modo de fala
                    state.isSpeaking = false; 
                    resetStatusIndicator();
                }
            } catch (error) {
                console.error("Erro na síntese de voz:", error); 
                state.isSpeaking = false; 
                resetStatusIndicator();
            }
        }

        // ==========================================
        // ÁUDIO E CONVERSORES
        // ==========================================
        function base64ToArrayBuffer(base64) {
            const binary_string = window.atob(base64);
            const bytes = new Uint8Array(binary_string.length);
            for (let i = 0; i < binary_string.length; i++) { bytes[i] = binary_string.charCodeAt(i); }
            return bytes.buffer;
        }

        function pcmToWav(pcmData, sampleRate) {
            const dataSize = pcmData.length * 2;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);
            const writeStr = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            
            writeStr(view, 0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeStr(view, 8, 'WAVE');
            writeStr(view, 12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeStr(view, 36, 'data'); view.setUint32(40, dataSize, true);
            
            let offset = 44; for (let i = 0; i < pcmData.length; i++, offset += 2) view.setInt16(offset, pcmData[i], true);
            return new Blob([view], { type: 'audio/wav' });
        }

        // ==========================================
        // SPEECH RECOGNITION
        // ==========================================
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechR = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechR();
                recognition.lang = 'pt-BR'; recognition.continuous = false; recognition.interimResults = false;
                
                recognition.onstart = () => { state.recognitionRunning = true; updateLiveUI(true); };
                recognition.onresult = (event) => { DOM.voiceToggle.checked = true; sendUserMessage(event.results[0][0].transcript); };
                recognition.onerror = (event) => {
                    if (event.error !== 'no-speech' && event.error !== 'aborted') {
                        showToast("Não foi possível compreender o áudio. Tente novamente.", "error"); 
                        state.isLiveActive = false; 
                        updateLiveUI(false);
                    }
                };
                recognition.onend = () => {
                    state.recognitionRunning = false;
                    if (state.isLiveActive && !state.isWaitingForResponse && !state.isSpeaking) setTimeout(safeStartRecognition, 100);
                    else if (!state.isLiveActive || (!state.isWaitingForResponse && !state.isSpeaking)) updateLiveUI(false);
                };
            }
        }

        function safeStartRecognition() {
            if (!recognition) return showToast("Seu navegador não suporta reconhecimento de voz.", "error");
            if (state.recognitionRunning || state.isWaitingForResponse || state.isSpeaking || !state.isLiveActive) return;
            try { recognition.start(); } catch (err) {}
        }

        function safeStopRecognition() {
            if (recognition && state.recognitionRunning) {
                try { recognition.stop(); } catch(e){}
            }
        }

        function updateLiveUI(isListening) {
            if (isListening) {
                DOM.liveBtn.className = 'bg-red-100 text-red-700 hover:bg-red-200 animate-pulse px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-colors shadow-sm';
                DOM.liveBtn.innerHTML = '<i class="fa-solid fa-stop"></i><span id="live-audio-text">Ouvindo...</span>';
                DOM.statusIndicator.innerHTML = `<i class="fa-solid fa-microphone text-indigo-500 animate-pulse"></i> Captando áudio`;
            } else {
                DOM.liveBtn.className = 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-colors shadow-sm';
                DOM.liveBtn.innerHTML = '<i class="fa-solid fa-microphone"></i><span id="live-audio-text">Falar com Mevis</span>';
                if(!state.isWaitingForResponse && !state.isSpeaking) resetStatusIndicator();
            }
        }

        // ==========================================
        // EVENT LISTENERS DELEGAÇÃO
        // ==========================================
        function setupEventListeners() {
            // Chat
            DOM.chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                sendUserMessage(DOM.chatInput.value);
            });

            // Tarefas (Adição)
            DOM.taskForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = DOM.taskInput.value.trim();
                if (text) {
                    state.tasks.push({ id: Date.now(), text, done: false });
                    DOM.taskInput.value = '';
                    renderTasks();
                }
            });

            // Tarefas (Delegação: Toggle e Delete)
            DOM.tasksContainer.addEventListener('click', (e) => {
                const item = e.target.closest('.task-item') || e.target.closest('[data-id]');
                if (!item) return;
                const id = parseInt(item.dataset.id, 10);
                
                if (e.target.classList.contains('task-checkbox')) {
                    const task = state.tasks.find(t => t.id === id);
                    if (task) { task.done = !task.done; renderTasks(); }
                } else if (e.target.closest('.btn-delete-task')) {
                    state.tasks = state.tasks.filter(t => t.id !== id);
                    renderTasks();
                }
            });

            // Ações Rápidas
            document.getElementById('btn-summarize').addEventListener('click', () => {
                if (state.isWaitingForResponse) return;
                const pending = state.tasks.filter(t => !t.done).map(t => t.text).join(", ");
                const prompt = pending ? `Por favor, resuma minhas tarefas pendentes: ${pending}. Sugira uma priorização lógica.` : `Não tenho tarefas pendentes no momento. Pode me ajudar com o planejamento do dia?`;
                sendUserMessage(prompt, true);
            });

            document.getElementById('btn-sei').addEventListener('click', () => {
                if (state.isWaitingForResponse) return;
                sendUserMessage("Prepare a estrutura de um ofício padrão SEI/BA para a Divisão de Análise e Provas Forenses da DIRPIN Leste. Deixe chaves como [NOME] para preenchimento posterior. Mantenha um tom estritamente formal e objetivo.", true);
            });

            document.getElementById('btn-osint').addEventListener('click', () => {
                if (state.isWaitingForResponse) return;
                sendUserMessage("Gere um template de extração de dados JSON (NER) para investigação OSINT em redes sociais. Estruture os campos claramente para facilitar a inserção no banco de dados.", true);
            });

            // Controle de Memória e Chaves
            document.getElementById('btn-clear').addEventListener('click', () => {
                if(confirm("Tem certeza que deseja apagar o histórico da conversa? Esta ação não pode ser desfeita.")) {
                    localStorage.removeItem('mevis_history');
                    state.history = [];
                    DOM.chatContainer.innerHTML = '';
                    addInitialGreeting();
                    saveState();
                }
            });

            document.getElementById('btn-reset-key').addEventListener('click', () => {
                if(confirm("Deseja alterar a chave da API do sistema? O sistema precisará ser reiniciado.")) {
                    localStorage.removeItem('mevis_api_key');
                    location.reload();
                }
            });

            // Upload de Arquivos
            DOM.btnUpload.addEventListener('click', () => DOM.fileUpload.click());
            DOM.fileUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    const fileContent = event.target.result;
                    const msg = `Fiz o upload do arquivo '${file.name}'. Por favor, leia e cruze os dados, elaborando um relatório executivo bem estruturado e analítico a partir do conteúdo.`;
                    sendUserMessage(msg, false, fileContent);
                    showToast("Arquivo importado com sucesso para análise.", "success");
                };
                reader.readAsText(file);
                this.value = ''; 
            });

            // Microfone
            DOM.liveBtn.addEventListener('click', () => {
                state.isLiveActive = !state.isLiveActive;
                if (state.isLiveActive) safeStartRecognition();
                else { safeStopRecognition(); updateLiveUI(false); }
            });
        }

        // Run
        init();
    </script>
</body>
</html>
